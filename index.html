<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Named Color to Hex Quiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
  }
  .shake { animation: shake 0.4s ease; }
  @keyframes correctBounce {
    0%{transform:scale(1)}
    30%{transform:scale(1.08)}
    60%{transform:scale(0.96)}
    100%{transform:scale(1)}
  }
  .correct-bounce { animation: correctBounce 0.35s ease; }
  @keyframes timerPulse {
    0%,100%{opacity:1}
    50%{opacity:0.5}
  }
  .timer-danger { animation: timerPulse 0.5s ease-in-out infinite; color: #f87171; }
  .progress-bar { transition: width 0.3s ease; }
  @keyframes fadeSlide {
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
  }
  .fade-slide { animation: fadeSlide 0.3s ease-out; }
</style>
</head>
<body class="bg-gray-950 text-white min-h-screen">

<div class="max-w-xl mx-auto px-4 py-8">

  </div>

    <h2 class="text-2xl font-bold mb-2">How well do you know CSS colors?</h2>
    <p class="text-gray-400 mb-6">20 questions · 20 seconds each · 147 named colors</p>

    <div class="mb-6">
      <p class="text-sm text-gray-400 mb-3 font-medium">Game Mode</p>
      <div class="grid grid-cols-2 gap-3">

          <div class="font-semibold">Name to Color</div>
          <div class="text-xs text-gray-300 mt-1">See the name, pick the swatch</div>
        </button>
        <button onclick="startGame('color-to-name')" class="bg-gradient-to-br from-purple-700 to-pink-800 hover:from-purple-600 hover:to-pink-700 rounded-xl p-4 text-left transition-all" aria-label="Color to Name mode">
          <div class="text-2xl mb-2">🎨 → 🔤</div>
          <div class="font-semibold">Color to Name</div>
          <div class="text-xs text-gray-300 mt-1">See the color, pick the name</div>
        </button>
      </div>
    </div>

    <div id="highScoreDisplay" class="text-sm text-gray-500"></div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="hidden">
    <!-- Progress & Score -->
    <div class="flex items-center justify-between mb-4">
      <div class="text-sm text-gray-400">
        Question <span id="qNumber" class="font-bold text-white">1</span>/20
      </div>
      <div class="flex items-center gap-3">
        <span class="text-sm">Score: <span id="scoreDisplay" class="font-bold text-cyan-400">0</span></span>
        <span id="timerDisplay" class="font-mono font-bold text-lg w-8 text-center" aria-live="polite">20</span>
      </div>
    </div>

    <!-- Progress bar -->
    <div class="h-1.5 bg-gray-800 rounded-full mb-5">
      <div id="progressBar" class="progress-bar h-full bg-gradient-to-r from-cyan-500 to-blue-500 rounded-full" style="width:0%"></div>
    </div>

    <!-- Timer bar -->
    <div class="h-1 bg-gray-800 rounded-full mb-6">
      <div id="timerBar" class="h-full bg-gradient-to-r from-green-500 to-emerald-400 rounded-full transition-all duration-1000 ease-linear" style="width:100%"></div>
    </div>

    <!-- Streak -->
    <div class="flex justify-center gap-2 mb-5" id="streakDots"></div>

    <!-- Question Area -->
    <div id="questionArea" class="bg-gray-900 rounded-2xl p-6 mb-5 fade-slide">
      <!-- Filled by JS -->
    </div>

    <!-- Options -->
    <div id="optionsGrid" class="grid grid-cols-2 gap-3 mb-5">
      <!-- Filled by JS -->
    </div>

    <!-- Feedback -->
    <div id="feedback" class="hidden bg-gray-900 rounded-xl p-4 fade-slide">
      <!-- Filled by JS -->
    </div>

    <button id="nextBtn" onclick="nextQuestion()" class="hidden w-full bg-indigo-700 hover:bg-indigo-600 rounded-xl py-3 font-semibold transition-all mt-3" aria-label="Next question">
      Next →
    </button>
  </div>

  <!-- RESULT SCREEN -->
  <div id="resultScreen" class="hidden bg-gray-900 rounded-2xl p-8 text-center">
    <div id="resultEmoji" class="text-6xl mb-4">🎉</div>
    <h2 id="resultTitle" class="text-2xl font-bold mb-2"></h2>
    <p id="resultScore" class="text-4xl font-bold text-cyan-400 mb-1"></p>

    <p id="highScoreMsg" class="text-yellow-400 font-semibold mb-6"></p>

    <div id="resultStats" class="grid grid-cols-3 gap-3 mb-6">

    </div>

    <div class="flex gap-3">
      <button onclick="startGame(currentMode)" class="flex-1 bg-cyan-700 hover:bg-cyan-600 rounded-xl py-3 font-semibold transition-all" aria-label="Play again">

      <button onclick="showStart()" class="flex-1 bg-gray-700 hover:bg-gray-600 rounded-xl py-3 font-semibold transition-all" aria-label="Back to menu">
        🏠 Menu
      </button>
    </div>
  </div>
</div>

function escapeHtml(s) {
  const d = document.createElement('div'); d.appendChild(document.createTextNode(s)); return d.innerHTML;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

let gameState = null;
let timerInterval = null;
let currentMode = 'name-to-color';

function getHighScore(mode) {
  return parseInt(localStorage.getItem(`cssColorQuiz_hs_${mode}`) || '0');
}
function setHighScore(mode, score) {
  if (score > getHighScore(mode)) {
    localStorage.setItem(`cssColorQuiz_hs_${mode}`, score);
    return true;
  }
  return false;
}

function showStart() {
  document.getElementById('startScreen').classList.remove('hidden');
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  const hs = `High scores: Name→Color: ${getHighScore('name-to-color')}/20 · Color→Name: ${getHighScore('color-to-name')}/20`;
  document.getElementById('highScoreDisplay').textContent = hs;
}

function startGame(mode) {
  currentMode = mode;
  clearInterval(timerInterval);

  const questions = shuffle(CSS_COLORS).slice(0, 20);
  gameState = {
    mode,
    questions,
    current: 0,
    score: 0,
    correct: 0,
    wrong: 0,
    streak: 0,
    maxStreak: 0,
    answered: false,
    timeLeft: 20,
  };

  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');

  renderQuestion();
}

function renderQuestion() {
  const gs = gameState;
  const q = gs.questions[gs.current];

  document.getElementById('qNumber').textContent = gs.current + 1;
  document.getElementById('scoreDisplay').textContent = gs.score;
  document.getElementById('progressBar').style.width = `${(gs.current/20)*100}%`;

  // Streak dots
  const dots = document.getElementById('streakDots');
  dots.innerHTML = Array(Math.min(gs.streak, 10)).fill('').map(() =>
    '<div class="w-2 h-2 rounded-full bg-yellow-400 shadow-lg" aria-hidden="true"></div>'
  ).join('');

  // Wrong options
  const wrongPool = shuffle(CSS_COLORS.filter(c => c.name !== q.name)).slice(0, 3);
  const options = shuffle([q, ...wrongPool]);

  const qArea = document.getElementById('questionArea');
  const optsGrid = document.getElementById('optionsGrid');
  document.getElementById('feedback').classList.add('hidden');
  document.getElementById('nextBtn').classList.add('hidden');

  if (gs.mode === 'name-to-color') {
    qArea.innerHTML = `
      <p class="text-sm text-gray-400 mb-2 text-center">Which color is...</p>
      <p class="text-3xl font-bold text-center text-white font-mono">${escapeHtml(q.name)}</p>
    `;
    optsGrid.innerHTML = options.map((opt, i) => `
      <button
        class="option-btn rounded-xl overflow-hidden border-2 border-transparent hover:border-white transition-all focus:outline-none focus:border-blue-400 h-20"
        style="background:${escapeHtml(opt.hex)}"
        onclick="selectAnswer(${i}, '${escapeHtml(opt.name)}')"
        data-name="${escapeHtml(opt.name)}"
        aria-label="Color option: ${escapeHtml(opt.name)}, ${escapeHtml(opt.hex)}"
      ></button>
    `).join('');
  } else {
    qArea.innerHTML = `
      <p class="text-sm text-gray-400 mb-3 text-center">What is this CSS color named?</p>
      <div class="w-32 h-32 rounded-xl mx-auto shadow-xl border-4 border-gray-700" style="background:${escapeHtml(q.hex)}" role="img" aria-label="Color swatch: ${escapeHtml(q.hex)}"></div>
      <p class="text-center text-sm text-gray-500 mt-2 font-mono">${escapeHtml(q.hex.toUpperCase())}</p>
    `;
    optsGrid.innerHTML = options.map((opt, i) => `
      <button
        class="option-btn rounded-xl p-3 bg-gray-800 hover:bg-gray-700 border-2 border-transparent transition-all text-sm font-medium font-mono focus:outline-none focus:border-blue-400"
        onclick="selectAnswer(${i}, '${escapeHtml(opt.name)}')"
        data-name="${escapeHtml(opt.name)}"
        aria-label="Color name: ${escapeHtml(opt.name)}"
      >${escapeHtml(opt.name)}</button>
    `).join('');
  }

  // Timer
  gs.answered = false;
  gs.timeLeft = 20;
  document.getElementById('timerDisplay').textContent = '20';
  document.getElementById('timerDisplay').className = 'font-mono font-bold text-lg w-8 text-center text-white';
  document.getElementById('timerBar').style.width = '100%';
  document.getElementById('timerBar').style.background = 'linear-gradient(to right, #10b981, #34d399)';

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (gs.answered) return;
    gs.timeLeft--;
    const pct = (gs.timeLeft / 20) * 100;
    const timerBar = document.getElementById('timerBar');
    timerBar.style.width = `${pct}%`;
    const timerDisp = document.getElementById('timerDisplay');
    timerDisp.textContent = gs.timeLeft;

    if (gs.timeLeft <= 5) {
      timerBar.style.background = 'linear-gradient(to right, #ef4444, #f97316)';
      timerDisp.className = 'font-mono font-bold text-lg w-8 text-center timer-danger';
    } else if (gs.timeLeft <= 10) {
      timerBar.style.background = 'linear-gradient(to right, #f59e0b, #fbbf24)';
    }

    if (gs.timeLeft <= 0) {
      clearInterval(timerInterval);
      timeUp();
    }
  }, 1000);

  qArea.classList.remove('fade-slide');
  void qArea.offsetWidth;
  qArea.classList.add('fade-slide');
}

function selectAnswer(i, selectedName) {
  if (gameState.answered) return;
  gameState.answered = true;
  clearInterval(timerInterval);

  const q = gameState.questions[gameState.current];
  const isCorrect = selectedName === q.name;

  // Visual feedback on buttons
  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.name === q.name) {
      btn.classList.add('border-green-400', 'bg-green-900/30');
      btn.classList.remove('border-transparent');
    } else if (btn.dataset.name === selectedName && !isCorrect) {
      btn.classList.add('border-red-400', 'bg-red-900/30', 'shake');
      btn.classList.remove('border-transparent');
    }
  });

  if (isCorrect) {
    gameState.score += 5;
    gameState.correct++;
    gameState.streak++;
    gameState.maxStreak = Math.max(gameState.maxStreak, gameState.streak);
    document.getElementById('scoreDisplay').textContent = gameState.score;
  } else {
    gameState.wrong++;
    gameState.streak = 0;
  }

  showFeedback(q, isCorrect);
}

function timeUp() {
  if (gameState.answered) return;
  gameState.answered = true;
  gameState.wrong++;
  gameState.streak = 0;
  const q = gameState.questions[gameState.current];

  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.name === q.name) {
      btn.classList.add('border-yellow-400', 'bg-yellow-900/30');
      btn.classList.remove('border-transparent');
    }
  });

  showFeedback(q, false, true);
}

function showFeedback(q, isCorrect, timedOut = false) {
  const fb = document.getElementById('feedback');
  fb.classList.remove('hidden');
  fb.classList.remove('fade-slide');
  void fb.offsetWidth;
  fb.classList.add('fade-slide');

  const statusEmoji = timedOut ? '⏰' : isCorrect ? '✅' : '❌';
  const statusText = timedOut ? 'Time\'s up!' : isCorrect ? 'Correct!' : 'Wrong!';
  const statusColor = timedOut ? 'text-yellow-400' : isCorrect ? 'text-green-400' : 'text-red-400';

  fb.innerHTML = `
    <div class="flex items-start gap-3">
      <div class="w-10 h-10 rounded-lg flex-shrink-0 border border-gray-600" style="background:${escapeHtml(q.hex)}" role="img" aria-label="Correct color: ${escapeHtml(q.name)}"></div>
      <div>
        <p class="${statusColor} font-bold">${statusEmoji} ${escapeHtml(statusText)}</p>
        <p class="text-white font-mono font-medium">${escapeHtml(q.name)} <span class="text-gray-400 text-sm">${escapeHtml(q.hex.toUpperCase())}</span></p>
        <p class="text-gray-400 text-sm mt-1">${escapeHtml(q.fun)}</p>
      </div>
    </div>
  `;

  document.getElementById('nextBtn').classList.remove('hidden');
}

function nextQuestion() {
  gameState.current++;
  if (gameState.current >= 20) {
    endGame();
  } else {
    renderQuestion();
  }
}

function endGame() {
  clearInterval(timerInterval);
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');

  const gs = gameState;
  const pct = Math.round((gs.correct / 20) * 100);
  const isNew = setHighScore(gs.mode, gs.correct);

  const emojis = pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : pct >= 50 ? '👍' : '📚';
  const titles = pct >= 90 ? 'CSS Color Master!' : pct >= 70 ? 'Color Expert!' : pct >= 50 ? 'Good Progress!' : 'Keep Practicing!';

  document.getElementById('resultEmoji').textContent = emojis;
  document.getElementById('resultTitle').textContent = titles;
  document.getElementById('resultScore').textContent = `${gs.correct}/20 correct`;
  document.getElementById('resultDetail').textContent = `Score: ${gs.score} points · ${pct}% accuracy`;
  document.getElementById('highScoreMsg').textContent = isNew ? '🌟 New High Score!' : `Best: ${getHighScore(gs.mode)}/20`;

  document.getElementById('resultStats').innerHTML = `
    <div class="bg-gray-800 rounded-xl p-3 text-center">
      <div class="text-2xl font-bold text-green-400">${gs.correct}</div>
      <div class="text-xs text-gray-400">Correct</div>
    </div>
    <div class="bg-gray-800 rounded-xl p-3 text-center">
      <div class="text-2xl font-bold text-red-400">${gs.wrong}</div>
      <div class="text-xs text-gray-400">Wrong</div>
    </div>
    <div class="bg-gray-800 rounded-xl p-3 text-center">
      <div class="text-2xl font-bold text-yellow-400">${gs.maxStreak}</div>
      <div class="text-xs text-gray-400">Best Streak</div>
    </div>
  `;
}

// Init
showStart();
</script>
</body>
</html>
